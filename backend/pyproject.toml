[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "cohere>=5.21.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.4.3",
    "langchain-cohere>=0.5.1",
    "llama-index>=0.12",
    "llama-index-embeddings-cohere>=0.8.0",
    "llama-index-llms-anthropic>=0.11.4",
    "llama-index-postprocessor-cohere-rerank>=0.8.0",
    "llama-index-readers-file>=0.6.0",
    "llama-index-retrievers-bm25>=0.7.1",
    "llama-index-vector-stores-pinecone>=0.8.0",
    "llama-parse>=0.6.94",
    "pinecone>=7.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that make real API calls (deselect with -m 'not slow')",
]
